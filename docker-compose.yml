services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./db:/data
    depends_on:
      - exec
    environment:
      - DB_PATH=/data/db.sqlite

  exec:
    build: ./exec
    ports:
      - "9000:9000"
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
